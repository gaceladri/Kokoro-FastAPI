name: kokoro-fastapi-cpu
services:
  kokoro-tts:
    # image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.2.0
    build:
      context: ../..
      dockerfile: docker/cpu/Dockerfile
    volumes:
      - ../../api:/app/api
      # Mount config directory for environment variables
      - ${CONFIG_DIR:-../../config}:/app/config
    ports:
      - "${PORT:-8880}:8880"
    environment:
      - PYTHONPATH=/app:/app/api
      - USE_GPU=false
      - PYTHONUNBUFFERED=1
      # Only set non-sensitive environment variables here
      - ENABLE_USAGE_TRACKING=${ENABLE_USAGE_TRACKING:-true}
      - DOWNLOAD_MODEL=${DOWNLOAD_MODEL:-true}
      # ONNX Optimization Settings for vectorized operations
      - ONNX_NUM_THREADS=8  # Maximize core usage for vectorized ops
      - ONNX_INTER_OP=4     # Parallel execution between operators
      - ONNX_INTRA_OP=4     # Parallel execution within operators
      - ONNX_EXECUTION_MODE=parallel
      - ONNX_OPTIMIZATION_LEVEL=all
      - ONNX_MEMORY_PATTERN=true
      - ONNX_ARENA_EXTEND_STRATEGY=kNextPowerOfTwo
      
